name: Daily Bet Analysis

on:
  schedule:
    # Objectif : pari généré avant 12h00 à La Réunion (08h00 UTC).
    # GitHub retarde souvent les crons de 30 min à 3h (surtout aux heures piles),
    # donc on programme plusieurs tentatives anticipées à des minutes décalées.
    # Le garde-fou anti-doublon du script fait que seule la première réussie
    # crée le pari ; les suivantes s'arrêtent immédiatement (aucun coût API).
    - cron: '7 5 * * *'  # 09h07 Réunion — tentative anticipée
    - cron: '7 6 * * *'  # 10h07 Réunion — 2e tentative
    - cron: '7 7 * * *'  # 11h07 Réunion — dernier filet avant midi
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  analyze_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run daily analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }} # optionnel : active le tennis (résultats via Tennis API ATP/WTA/ITF)
        run: npm run analyze

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add public/data/bankroll.json public/data/bets.json DAILY_BET.md
          git diff --quiet && git diff --staged --quiet || (git commit -m "Automatisation: Nouveau pari quotidien [skip ci]" && git push)
