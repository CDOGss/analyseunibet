name: Daily Bet Analysis

on:
  schedule:
    # Objectif : pari généré avant 12h00 à La Réunion (08h00 UTC).
    # GitHub retarde souvent les crons de 30 min à 3h (surtout aux heures piles),
    # donc on programme plusieurs tentatives anticipées à des minutes décalées.
    # Le garde-fou anti-doublon du script fait que seule la première réussie
    # crée le pari ; les suivantes s'arrêtent immédiatement (aucun coût API).
    - cron: '12 5 * * *'  # 09h12 Réunion — tentative anticipée
    - cron: '12 6 * * *'  # 10h12 Réunion — 2e tentative
    - cron: '12 7 * * *'  # 11h12 Réunion — dernier filet avant midi
  workflow_dispatch: # Permet de lancer manuellement depuis l'interface GitHub

jobs:
  analyze_and_commit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Run daily analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          RAPIDAPI_KEY: ${{ secrets.RAPIDAPI_KEY }} # optionnel : active le tennis (résultats via Tennis API ATP/WTA/ITF)
        run: npm run analyze

      - name: Commit and Push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          # public/data inclut last_run.json (trace des jours sans pari)
          git add -A public/data DAILY_BET.md
          if git diff --staged --quiet; then echo "Rien à committer."; exit 0; fi
          git commit -m "Automatisation: Nouveau pari quotidien [skip ci]"
          # Push résilient : rebase si le dépôt a avancé, nouvel essai sur les erreurs
          # passagères de GitHub (Internal Server Error constatée le 24/09 et le 07/10/2026).
          for i in 1 2 3 4 5; do
            if git pull --rebase --autostash origin "$GITHUB_REF_NAME" && git push origin "HEAD:$GITHUB_REF_NAME"; then
              break
            fi
            if [ "$i" = 5 ]; then echo "::error::push impossible après 5 tentatives"; exit 1; fi
            echo "Push refusé (tentative $i), nouvel essai dans $((i * 15)) s..."
            sleep $((i * 15))
          done
